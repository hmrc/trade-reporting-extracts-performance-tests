journeys {

  tre-reports = {
    description = "TRE Reports"

    load = 8.34

    # Calculation:
    # A = 8,000 "reports a day peak" / (8hrs * 3,600s)  = 0.28 -- Assumes 'worst-case' that only 1 report is being submitted per journey
    # B = A * 60 "seconds to complete journey"          = 5.56 -- 'peak' load value
    #     B * 1.5                                       = 8.34 -- Final load value of one-and-half of 'peak'
    
    parts = [
      request-new-report,
      requested-reports,
      downloadable-reports
    ]
  }

  tre-thirdParty = {
    description = "TRE Third Party"

    load = 0.77

    # Third Party:
    # Of 1,848 users 153 were third party (8.29%) of which requested 317 of 46,298 total reports (est. 2 per third party) in 2020.

    # A = 8.29% of 40,000 "expected users per month"                              = 3,316 -- third parties per month. Assumes ratio is kept the same.
    # B = A + (A * 2 "reports made")                                              = 9,948 -- total of third parties AND users served by third parties. Assumes one report per user by third party.
    # C = ((B / 30 "days") / (8hrs * 3,600s)) * 45 "seconds to complete journey"  = 0.51 -- 'peak' load value
    #     C * 1.5                                                                 = 0.77 -- Final load value of one-and-half of 'peak'
    
    parts = [
      add-third-party,
      manage-third-party
    ]
  }

  tre-yourAccount = {
    description = "TRE Your Account"

    load = 0.69

    # Your Account:
    # A = ((40,000 "expected users per month" / 30 "days") / (8hrs * 3,600s)) * 10 "seconds to complete"  = 0.46 -- 'peak' load value
    #     A * 1.5                                                                                         = 0.69 -- Final load value of one-and-half of 'peak'

    parts = [
      your-account-additional-email
    ]
  }
}